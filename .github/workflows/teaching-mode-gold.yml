name: Teaching Mode Gold Gate

on:
  push:
    branches: [teaching-mode]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Teaching Mode contract audit
        run: node scripts/teaching-mode-gold-contract.mjs
