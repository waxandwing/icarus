name: B08 verify

on:
  push:
    branches:
      - b08/authenticated-persistence
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Locate Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: B08 hostile account and reload circuit
        run: node tests/b08-browser-v3.cdp.mjs
      - name: Retain rendered B08 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b08-rendered-evidence
          path: artifacts/
          if-no-files-found: ignore
