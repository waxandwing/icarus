name: Verify

on:
  pull_request:
  push:
    branches:
      - cursor/arc-planner-native-ux-6b55
      - experiment/arc-design-audit-prototype

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - run: npx oxlint src
