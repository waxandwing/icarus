<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Table · Classroom</title>
<style>
:root{--cream:#F4ECDD;--charcoal:#3F3F3A;--dark-teal:#0E5661;--teal:#2D7B82;--yellow:#E2B647;--orange:#D88A3D;--terracotta:#C96845;--pink:#D89AA4;--sage:#9DAA8B;--kraft:#B79A72;--lavender:#9C93B8;--muted:rgba(63,63,58,.66)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--cream);color:var(--charcoal);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}.join{height:100%;display:grid;place-items:center;padding:32px;background:var(--cream);position:relative;overflow:hidden}.join:before{content:"";position:absolute;width:420px;height:420px;border:38px solid var(--yellow);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;top:-235px;right:-180px}.join:after{content:"";position:absolute;width:290px;height:290px;border:30px solid var(--terracotta);border-right-color:transparent;border-top-color:transparent;border-radius:50%;bottom:-180px;left:-130px}.joinBox{position:relative;z-index:1;width:min(620px,100%);padding:44px 0 38px;border-top:3px solid var(--charcoal);border-bottom:1px solid rgba(63,63,58,.26);text-align:left}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--dark-teal);margin-bottom:18px}.join h1{font-family:"League Spartan",Inter,sans-serif;font-size:clamp(50px,7vw,84px);line-height:.92;letter-spacing:-.035em;margin:0 0 14px}.join p{color:var(--muted);font-size:18px;line-height:1.5;max-width:470px}.code{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:30px}.code input{min-height:64px;border:0;border-bottom:3px solid var(--charcoal);background:transparent;padding:0 4px;font-size:28px;text-transform:uppercase;letter-spacing:.14em}.code button{min-width:132px;border:2px solid var(--dark-teal);background:var(--dark-teal);color:var(--cream);font-weight:900;border-radius:4px}.error{margin-top:14px;color:#8A332E;font-weight:700}.room{display:none;position:relative;width:100%;height:100%;overflow:hidden;background:var(--cream)}.room.active{display:block}.room:after{content:"";position:absolute;right:-90px;bottom:-110px;width:220px;height:220px;border:26px solid var(--yellow);border-left-color:transparent;border-top-color:transparent;border-radius:50%;opacity:.55;pointer-events:none}.progress{position:absolute;top:0;left:0;right:0;height:92px;display:grid;border-bottom:2px solid var(--charcoal);z-index:3;padding:0 4vw;background:rgba(244,236,221,.94)}.step{display:flex;align-items:flex-end;justify-content:center;padding:0 8px 18px;text-align:center;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:clamp(9px,.9vw,14px);font-weight:750;position:relative}.step.current{font-weight:900;color:var(--charcoal)}.step.current:after{content:"";position:absolute;left:16%;right:16%;bottom:-2px;height:6px;background:var(--terracotta)}.clock{position:absolute;z-index:6;top:112px;font-family:"League Spartan",Inter,sans-serif;font-size:clamp(34px,3vw,54px);font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--charcoal)}.clock.top-right{right:4vw}.clock.top-left{left:4vw}.pass{position:absolute;z-index:7;bottom:30px;min-width:170px;padding:10px 0 8px 18px;font-weight:900;border-left:10px solid var(--sage);border-bottom:2px solid var(--charcoal);background:transparent}.pass.bottom-left{left:4vw}.pass.bottom-right{right:4vw}.pass.inuse{border-left-color:var(--yellow)}.timer{position:absolute;z-index:10;top:112px;left:50%;transform:translateX(-50%);width:170px;height:170px;border:10px solid var(--dark-teal);border-right-color:var(--yellow);border-radius:50%;display:grid;place-content:center;text-align:center;background:var(--cream)}.timer.cleanup{border-color:var(--terracotta);border-right-color:var(--yellow)}.timer strong{display:block;font-family:"League Spartan",Inter,sans-serif;font-size:clamp(38px,4.2vw,56px);line-height:.9;letter-spacing:-.025em}.timer span{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:var(--dark-teal);margin-bottom:6px}.timer.cleanup span{color:var(--terracotta)}.content{height:100%;display:flex;align-items:center;justify-content:center;padding:154px 8vw 118px}.contentInner{width:100%;max-width:1260px}.content h1{font-family:"League Spartan",Inter,sans-serif;font-size:clamp(56px,7vw,110px);line-height:.92;letter-spacing:-.04em;margin:.08em 0 .22em;max-width:1180px}.content p{font-size:clamp(28px,2.6vw,46px);line-height:1.28;max-width:1120px;margin:0;white-space:pre-wrap}.state{position:absolute;inset:0;z-index:40;display:none}.state.active{display:block}.state.blank{background:#000}.state.held{pointer-events:none;background:transparent}.state.held:after{content:"HOLD HERE";position:absolute;left:50%;bottom:32px;transform:translateX(-50%);color:var(--dark-teal);border-bottom:3px solid var(--yellow);padding:8px 4px;font-size:14px;font-weight:900;letter-spacing:.14em}.connection{position:absolute;right:22px;bottom:18px;z-index:30;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted)}.room[data-blank="true"] .connection{display:none}.room[data-blank="true"]:after{display:none}@media(max-width:700px){.joinBox{padding:34px 0}.code{grid-template-columns:1fr}.progress{height:72px;padding:0 2vw}.step{font-size:7px;padding-bottom:14px}.content{padding:118px 5vw 100px}.clock{top:88px;font-size:28px}.timer{top:84px;width:142px;height:142px;border-width:8px}.timer strong{font-size:38px}.clock.timerActive{display:none}.pass{min-width:145px;bottom:18px}.state.held:after{bottom:18px}.connection{right:16px;bottom:14px}.room:after{width:160px;height:160px;border-width:20px}}@media(max-height:480px){.progress{height:56px;padding:0 3vw}.step{font-size:7px;padding-bottom:10px}.timer{top:68px;left:auto;right:4vw;transform:none;width:104px;height:104px;border-width:6px}.timer strong{font-size:30px}.timer span{font-size:8px;margin-bottom:3px}.clock{top:70px;font-size:26px}.content{padding:68px 190px 54px 5vw;align-items:center;justify-content:flex-start}.content h1{font-size:clamp(42px,8vw,58px);margin:.06em 0 .14em}.content p{font-size:clamp(20px,3.8vw,26px);line-height:1.2}.pass.bottom-left,.pass.bottom-right{left:auto;right:4vw;bottom:16px;min-width:128px;padding:8px 0 6px 14px;border-left-width:8px;font-size:12px}.connection{display:none}.state.held:after{left:5vw;bottom:12px;transform:none;font-size:11px;padding:5px 2px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section id="join" class="join"><div class="joinBox"><div class="brand">ARC · TABLE</div><h1>Join the room.</h1><p>Enter the code from your teacher’s screen. This display does not use a teacher login.</p><form id="joinForm" class="code"><input id="roomCode" maxlength="8" autocomplete="one-time-code" aria-label="Room code" required><button>Join room</button></form><div id="error" class="error" role="alert"></div></div></section>
<section id="room" class="room" aria-label="Student classroom display"><div id="progress" class="progress"></div><div id="clock" class="clock top-right"></div><div id="timer" class="timer" hidden><span id="timerLabel">Timer</span><strong id="timerTime">00:00</strong></div><div class="content"><div class="contentInner"><h1 id="title"></h1><p id="body"></p></div></div><div id="pass" class="pass bottom-left">PASS<br><span id="passLabel">AVAILABLE</span></div><div id="held" class="state held" aria-label="Classroom display held"></div><div id="blank" class="state blank" aria-label="Paused classroom display"></div><div id="connection" class="connection">Connecting…</div></section>
<script>
const ENDPOINT='https://jnbppgjkzzuquhenaqtq.supabase.co/functions/v1/teaching-session';const KEY='arcTeachingRoomJoinV1';let session=null;let projection=null;let pollTimer=null;let clockTimer=null;let lastGood=0;const $=s=>document.querySelector(s);
async function post(body){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}
function saveJoin(){sessionStorage.setItem(KEY,JSON.stringify({roomCode:session.room_code,channelKey:session.channel_key}))}function clearJoin(){sessionStorage.removeItem(KEY)}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function render(){if(!projection)return;$('#join').style.display='none';const room=$('#room');room.classList.add('active');const isBlank=projection.roomMode==='blank'||projection.roomMode==='paused';room.dataset.blank=String(isBlank);const steps=projection.steps||[];$('#progress').style.gridTemplateColumns=`repeat(${Math.max(1,steps.length)},1fr)`;$('#progress').innerHTML=steps.map((s,i)=>`<div class="step ${i===projection.releasedStepIndex?'current':''}">${escapeHtml(s.title)}</div>`).join('');const current=steps[projection.releasedStepIndex]||{title:'',body:''};$('#title').textContent=current.title;$('#body').textContent=current.body;const clock=$('#clock');clock.hidden=projection.clockVisible===false;clock.className=`clock ${projection.layout?.clock||'top-right'} ${projection.timer?.active?'timerActive':''}`;const pass=$('#pass');pass.className=`pass ${projection.layout?.pass||'bottom-left'} ${projection.pass?.active?'inuse':''}`;$('#passLabel').textContent=projection.pass?.publicLabel||'AVAILABLE';$('#held').classList.toggle('active',projection.roomMode==='held');$('#blank').classList.toggle('active',isBlank);const timer=$('#timer');timer.hidden=!projection.timer?.active;timer.classList.toggle('cleanup',projection.timer?.kind==='cleanup');$('#timerLabel').textContent=projection.timer?.kind==='cleanup'?'Cleanup':'Timer';updateTimer()}
function updateTimer(){if(projection?.timer?.active&&projection.timer.endsAt){$('#timerTime').textContent=fmt(new Date(projection.timer.endsAt).getTime()-Date.now())}const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function join(code){$('#error').textContent='';const {session:s}=await post({action:'join',roomCode:code});session=s;projection=s.room_projection;saveJoin();lastGood=Date.now();render();startPolling()}
async function sync(){if(!session)return;try{const {session:s}=await post({action:'sync',roomCode:session.room_code,channelKey:session.channel_key});session={...session,...s};projection=s.room_projection;lastGood=Date.now();$('#connection').textContent='Connected';render()}catch(e){const age=Date.now()-lastGood;$('#connection').textContent=age<15000?'Reconnecting…':'Room disconnected';if(String(e.message).includes('room_not_found')){clearInterval(pollTimer);$('#connection').textContent='Session ended'}}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(sync,900);sync()}
$('#joinForm').addEventListener('submit',async e=>{e.preventDefault();try{await join($('#roomCode').value.trim().toUpperCase())}catch(err){$('#error').textContent=err.message==='room_not_found'?'That room is not active. Check the code.':'Could not join this room.'}});clockTimer=setInterval(updateTimer,500);updateTimer();
try{const saved=JSON.parse(sessionStorage.getItem(KEY)||'null');if(saved?.roomCode&&saved?.channelKey){session={room_code:saved.roomCode,channel_key:saved.channelKey};sync().then(()=>{if(projection){saveJoin();render();startPolling()}else clearJoin()}).catch(clearJoin)}}catch(e){clearJoin()}
</script>
</body>
</html>
