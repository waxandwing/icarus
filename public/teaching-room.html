<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Classroom</title>
<style>
:root{--paper:#fbf8f1;--ink:#2c2e2e;--line:rgba(44,46,46,.16);--red:#b5453e;--mustard:#e4b33d;--muted:#746f68}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid #235e99;outline-offset:3px}.join{height:100%;display:grid;place-items:center;padding:24px}.joinBox{width:min(560px,100%);text-align:center}.join h1{font-family:Georgia,serif;font-size:clamp(48px,7vw,82px);margin:0 0 8px}.join p{color:var(--muted);font-size:18px}.code{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:24px}.code input{min-height:60px;border:1px solid var(--line);background:#fff;padding:0 18px;font-size:26px;text-transform:uppercase;letter-spacing:.12em}.code button{min-width:120px;border:0;background:var(--ink);color:#fff;font-weight:800}.error{margin-top:12px;color:#8a332e}.room{display:none;position:relative;width:100%;height:100%;overflow:hidden}.room.active{display:block}.progress{position:absolute;top:18px;left:4vw;right:4vw;height:68px;display:grid;border-bottom:1px solid var(--line);z-index:3}.step{padding:10px 6px 0;text-align:center;text-transform:uppercase;letter-spacing:.04em;color:#7f7a71;font-size:clamp(9px,.9vw,14px);position:relative}.step.current{font-weight:900;color:var(--ink)}.step.current:after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--red)}.clock{position:absolute;z-index:6;top:96px;font-family:Georgia,serif;font-size:clamp(26px,3vw,52px);font-weight:700;line-height:1}.clock.top-right{right:3vw}.clock.top-left{left:3vw}.pass{position:absolute;z-index:7;bottom:22px;min-width:150px;border:2px solid var(--ink);background:var(--mustard);padding:11px 15px;font-weight:900;box-shadow:3px 3px 0 rgba(44,46,46,.18)}.pass.bottom-left{left:3vw}.pass.bottom-right{right:3vw}.pass.inuse{background:#fff3dc}.timer{position:absolute;z-index:10;top:105px;left:50%;transform:translateX(-50%);min-width:260px;background:var(--ink);color:#fff;padding:12px 18px;text-align:center}.timer.cleanup{background:var(--red)}.timer strong{display:block;font-family:Georgia,serif;font-size:clamp(34px,4.5vw,68px);line-height:1}.timer span{font-size:12px;text-transform:uppercase;letter-spacing:.1em}.content{height:100%;display:flex;align-items:center;justify-content:center;padding:120px 6vw 92px}.contentInner{width:100%;max-width:1180px}.content h1{font-family:Georgia,serif;font-size:clamp(44px,6vw,92px);line-height:1.02;margin:.2em 0}.content p{font-size:clamp(20px,2vw,34px);line-height:1.34}.state{position:absolute;inset:0;z-index:40;display:none;place-items:center;text-align:center;padding:40px}.state.active{display:grid}.state.blank{background:#000;padding:0}.state.held{background:var(--paper)}.state h1{font-family:Georgia,serif;font-size:clamp(48px,8vw,110px);margin:0}.connection{position:absolute;right:18px;bottom:16px;z-index:30;font-size:12px;color:var(--muted)}@media(max-width:600px){.code{grid-template-columns:1fr}.progress{left:2vw;right:2vw;height:58px}.step{font-size:7px}.content{padding-top:100px}.clock{font-size:26px}.timer{top:82px;min-width:220px}.clock.timerActive{display:none}.pass{min-width:132px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<section id="join" class="join"><div class="joinBox"><div>ARC · CLASSROOM</div><h1>Join the room.</h1><p>Enter the code from the teacher screen. No teacher login is used here.</p><form id="joinForm" class="code"><input id="roomCode" maxlength="8" autocomplete="one-time-code" aria-label="Room code" required><button>Join</button></form><div id="error" class="error" role="alert"></div></div></section>
<section id="room" class="room" aria-label="Classroom display"><div id="progress" class="progress"></div><div id="clock" class="clock top-right"></div><div id="timer" class="timer" hidden><span id="timerLabel">Timer</span><strong id="timerTime">00:00</strong></div><div class="content"><div class="contentInner"><h1 id="title"></h1><p id="body"></p></div></div><div id="pass" class="pass bottom-left">PASS<br><span id="passLabel">AVAILABLE</span></div><div id="held" class="state held"><div><div>ARC CLASSROOM</div><h1>Hold here.</h1></div></div><div id="blank" class="state blank" aria-label="Paused classroom display"></div><div id="connection" class="connection">Connecting…</div></section>
<script>
const ENDPOINT='https://jnbppgjkzzuquhenaqtq.supabase.co/functions/v1/teaching-session';const KEY='arcTeachingRoomJoinV1';let session=null;let projection=null;let pollTimer=null;let clockTimer=null;let lastGood=0;const $=s=>document.querySelector(s);
async function post(body){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}
function saveJoin(){sessionStorage.setItem(KEY,JSON.stringify({roomCode:session.room_code,channelKey:session.channel_key}))}function clearJoin(){sessionStorage.removeItem(KEY)}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function render(){if(!projection)return;$('#join').style.display='none';$('#room').classList.add('active');const steps=projection.steps||[];$('#progress').style.gridTemplateColumns=`repeat(${Math.max(1,steps.length)},1fr)`;$('#progress').innerHTML=steps.map((s,i)=>`<div class="step ${i===projection.releasedStepIndex?'current':''}">${escapeHtml(s.title)}</div>`).join('');const current=steps[projection.releasedStepIndex]||{title:'',body:''};$('#title').textContent=current.title;$('#body').textContent=current.body;const clock=$('#clock');clock.hidden=projection.clockVisible===false;clock.className=`clock ${projection.layout?.clock||'top-right'} ${projection.timer?.active?'timerActive':''}`;const pass=$('#pass');pass.className=`pass ${projection.layout?.pass||'bottom-left'} ${projection.pass?.active?'inuse':''}`;$('#passLabel').textContent=projection.pass?.publicLabel||'AVAILABLE';$('#held').classList.toggle('active',projection.roomMode==='held');$('#blank').classList.toggle('active',projection.roomMode==='blank'||projection.roomMode==='paused');const timer=$('#timer');timer.hidden=!projection.timer?.active;timer.classList.toggle('cleanup',projection.timer?.kind==='cleanup');$('#timerLabel').textContent=projection.timer?.kind==='cleanup'?'Cleanup':'Timer';updateTimer();}
function updateTimer(){if(projection?.timer?.active&&projection.timer.endsAt){$('#timerTime').textContent=fmt(new Date(projection.timer.endsAt).getTime()-Date.now())}const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function join(code){$('#error').textContent='';const {session:s}=await post({action:'join',roomCode:code});session=s;projection=s.room_projection;saveJoin();lastGood=Date.now();render();startPolling()}
async function sync(){if(!session)return;try{const {session:s}=await post({action:'sync',roomCode:session.room_code,channelKey:session.channel_key});session={...session,...s};projection=s.room_projection;lastGood=Date.now();$('#connection').textContent='Connected';render()}catch(e){const age=Date.now()-lastGood;$('#connection').textContent=age<15000?'Reconnecting…':'Room disconnected';if(String(e.message).includes('room_not_found')){clearInterval(pollTimer);$('#connection').textContent='Session ended';}}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(sync,900);sync()}
$('#joinForm').addEventListener('submit',async e=>{e.preventDefault();try{await join($('#roomCode').value.trim().toUpperCase())}catch(err){$('#error').textContent=err.message==='room_not_found'?'That room is not active. Check the code.':'Could not join this room.'}});clockTimer=setInterval(updateTimer,500);updateTimer();
try{const saved=JSON.parse(sessionStorage.getItem(KEY)||'null');if(saved?.roomCode&&saved?.channelKey){session={room_code:saved.roomCode,channel_key:saved.channelKey};sync().then(()=>{if(projection){saveJoin();render();startPolling()}else clearJoin()}).catch(clearJoin)}}catch(e){clearJoin()}
</script>
</body>
</html>
