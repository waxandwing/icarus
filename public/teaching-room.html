<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arc Table · Classroom</title>
<style>
:root{--paper:#f3ebdd;--white:#fbf8f1;--ink:#2c2e2e;--line:#d9d0bd;--green:#174f46;--blue:#7c9cad;--mustard:#e4b33d;--terracotta:#c96845;--muted:#746f68}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.join{height:100%;display:grid;place-items:center;padding:28px;background:var(--paper);position:relative;overflow:hidden}.join:before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;background:var(--mustard);top:-250px;right:-210px}.join:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:var(--terracotta);bottom:-220px;left:-190px}.joinBox{position:relative;z-index:1;width:min(620px,100%);background:var(--white);border:2px solid var(--ink);padding:42px;text-align:left}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--green);margin-bottom:18px}.join h1{font-family:"League Spartan",Inter,sans-serif;font-size:clamp(48px,7vw,82px);line-height:.95;margin:0 0 12px}.join p{color:var(--muted);font-size:18px;line-height:1.5;max-width:470px}.code{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:28px}.code input{min-height:64px;border:2px solid var(--ink);background:#fff;padding:0 18px;font-size:28px;text-transform:uppercase;letter-spacing:.14em;border-radius:8px}.code button{min-width:130px;border:2px solid var(--green);background:var(--green);color:#fff;font-weight:900;border-radius:8px}.error{margin-top:14px;color:#8a332e;font-weight:700}.room{display:none;position:relative;width:100%;height:100%;overflow:hidden;background:var(--paper)}.room.active{display:block}.progress{position:absolute;top:0;left:0;right:0;height:96px;display:grid;background:rgba(251,248,241,.9);border-bottom:2px solid var(--ink);z-index:3;padding:0 4vw}.step{display:flex;align-items:flex-end;justify-content:center;padding:0 8px 18px;text-align:center;text-transform:uppercase;letter-spacing:.08em;color:#7f7a71;font-size:clamp(9px,.9vw,14px);font-weight:700;position:relative}.step.current{font-weight:900;color:var(--ink)}.step.current:after{content:"";position:absolute;left:12%;right:12%;bottom:-2px;height:6px;border-radius:6px;background:var(--terracotta)}.clock{position:absolute;z-index:6;top:118px;font-family:"League Spartan",Inter,sans-serif;font-size:clamp(32px,3vw,54px);font-weight:800;line-height:1;background:var(--white);border:2px solid var(--ink);padding:14px 18px;border-radius:10px}.clock.top-right{right:3vw}.clock.top-left{left:3vw}.pass{position:absolute;z-index:7;bottom:28px;min-width:180px;border:2px solid var(--ink);background:var(--white);padding:14px 18px;font-weight:900;border-radius:10px}.pass:before{content:"";position:absolute;top:0;bottom:0;left:0;width:12px;background:#9aaa89;border-radius:8px 0 0 8px}.pass.bottom-left{left:3vw}.pass.bottom-right{right:3vw}.pass.inuse{border-color:var(--mustard);padding-left:24px}.pass.inuse:before{background:var(--mustard)}.timer{position:absolute;z-index:10;top:115px;left:50%;transform:translateX(-50%);min-width:320px;background:var(--white);border:3px solid var(--green);padding:16px 24px;text-align:center;border-radius:16px}.timer.cleanup{border-color:var(--terracotta)}.timer strong{display:block;font-family:"League Spartan",Inter,sans-serif;font-size:clamp(42px,5vw,72px);line-height:.95}.timer span{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:var(--green)}.timer.cleanup span{color:var(--terracotta)}.content{height:100%;display:flex;align-items:center;justify-content:center;padding:160px 7vw 120px}.contentInner{width:100%;max-width:1260px}.content h1{font-family:"League Spartan",Inter,sans-serif;font-size:clamp(54px,7vw,108px);line-height:.95;margin:.1em 0 .22em;max-width:1200px}.content p{font-size:clamp(28px,2.6vw,46px);line-height:1.28;max-width:1180px;margin:0;white-space:pre-wrap}.state{position:absolute;inset:0;z-index:40;display:none}.state.active{display:block}.state.blank{background:#000}.state.held{pointer-events:none;background:transparent}.state.held:after{content:"HOLD HERE";position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--white);color:var(--green);border:2px solid var(--green);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:900;letter-spacing:.14em}.connection{position:absolute;right:18px;bottom:16px;z-index:30;font-size:12px;font-weight:700;color:var(--muted);background:rgba(251,248,241,.82);padding:6px 9px;border-radius:6px}.room[data-blank="true"] .connection{display:none}@media(max-width:700px){.joinBox{padding:28px}.code{grid-template-columns:1fr}.progress{height:72px;padding:0 2vw}.step{font-size:7px;padding-bottom:14px}.content{padding:120px 5vw 100px}.clock{top:88px;font-size:28px}.timer{top:86px;min-width:230px}.clock.timerActive{display:none}.pass{min-width:145px;bottom:18px}.state.held:after{bottom:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<section id="join" class="join"><div class="joinBox"><div class="brand">ARC · TABLE</div><h1>Join the room.</h1><p>Enter the code from your teacher’s screen. This display does not use a teacher login.</p><form id="joinForm" class="code"><input id="roomCode" maxlength="8" autocomplete="one-time-code" aria-label="Room code" required><button>Join room</button></form><div id="error" class="error" role="alert"></div></div></section>
<section id="room" class="room" aria-label="Student classroom display"><div id="progress" class="progress"></div><div id="clock" class="clock top-right"></div><div id="timer" class="timer" hidden><span id="timerLabel">Timer</span><strong id="timerTime">00:00</strong></div><div class="content"><div class="contentInner"><h1 id="title"></h1><p id="body"></p></div></div><div id="pass" class="pass bottom-left">PASS<br><span id="passLabel">AVAILABLE</span></div><div id="held" class="state held" aria-label="Classroom display held"></div><div id="blank" class="state blank" aria-label="Paused classroom display"></div><div id="connection" class="connection">Connecting…</div></section>
<script>
const ENDPOINT='https://jnbppgjkzzuquhenaqtq.supabase.co/functions/v1/teaching-session';const KEY='arcTeachingRoomJoinV1';let session=null;let projection=null;let pollTimer=null;let clockTimer=null;let lastGood=0;const $=s=>document.querySelector(s);
async function post(body){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}
function saveJoin(){sessionStorage.setItem(KEY,JSON.stringify({roomCode:session.room_code,channelKey:session.channel_key}))}function clearJoin(){sessionStorage.removeItem(KEY)}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function render(){if(!projection)return;$('#join').style.display='none';const room=$('#room');room.classList.add('active');const isBlank=projection.roomMode==='blank'||projection.roomMode==='paused';room.dataset.blank=String(isBlank);const steps=projection.steps||[];$('#progress').style.gridTemplateColumns=`repeat(${Math.max(1,steps.length)},1fr)`;$('#progress').innerHTML=steps.map((s,i)=>`<div class="step ${i===projection.releasedStepIndex?'current':''}">${escapeHtml(s.title)}</div>`).join('');const current=steps[projection.releasedStepIndex]||{title:'',body:''};$('#title').textContent=current.title;$('#body').textContent=current.body;const clock=$('#clock');clock.hidden=projection.clockVisible===false;clock.className=`clock ${projection.layout?.clock||'top-right'} ${projection.timer?.active?'timerActive':''}`;const pass=$('#pass');pass.className=`pass ${projection.layout?.pass||'bottom-left'} ${projection.pass?.active?'inuse':''}`;$('#passLabel').textContent=projection.pass?.publicLabel||'AVAILABLE';$('#held').classList.toggle('active',projection.roomMode==='held');$('#blank').classList.toggle('active',isBlank);const timer=$('#timer');timer.hidden=!projection.timer?.active;timer.classList.toggle('cleanup',projection.timer?.kind==='cleanup');$('#timerLabel').textContent=projection.timer?.kind==='cleanup'?'Cleanup':'Timer';updateTimer()}
function updateTimer(){if(projection?.timer?.active&&projection.timer.endsAt){$('#timerTime').textContent=fmt(new Date(projection.timer.endsAt).getTime()-Date.now())}const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function join(code){$('#error').textContent='';const {session:s}=await post({action:'join',roomCode:code});session=s;projection=s.room_projection;saveJoin();lastGood=Date.now();render();startPolling()}
async function sync(){if(!session)return;try{const {session:s}=await post({action:'sync',roomCode:session.room_code,channelKey:session.channel_key});session={...session,...s};projection=s.room_projection;lastGood=Date.now();$('#connection').textContent='Connected';render()}catch(e){const age=Date.now()-lastGood;$('#connection').textContent=age<15000?'Reconnecting…':'Room disconnected';if(String(e.message).includes('room_not_found')){clearInterval(pollTimer);$('#connection').textContent='Session ended'}}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(sync,900);sync()}
$('#joinForm').addEventListener('submit',async e=>{e.preventDefault();try{await join($('#roomCode').value.trim().toUpperCase())}catch(err){$('#error').textContent=err.message==='room_not_found'?'That room is not active. Check the code.':'Could not join this room.'}});clockTimer=setInterval(updateTimer,500);updateTimer();
try{const saved=JSON.parse(sessionStorage.getItem(KEY)||'null');if(saved?.roomCode&&saved?.channelKey){session={room_code:saved.roomCode,channel_key:saved.channelKey};sync().then(()=>{if(projection){saveJoin();render();startPolling()}else clearJoin()}).catch(clearJoin)}}catch(e){clearJoin()}
</script>
</body>
</html>
